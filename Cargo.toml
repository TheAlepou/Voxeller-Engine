[package]
name    = "voxeller-engine"
version = "0.1.0"
edition = "2021"

# Platform-agnostic dependencies
[dependencies]
winit      = "0.30"
glam       = "0.29"
bytemuck   = { version = "1", features = ["derive"] }
anyhow     = "1"
log        = "0.4"
env_logger = "0.11"

# macOS — Metal raytracing backend
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
objc  = "0.2"
core-graphics-types = "0.2"

# Linux / Windows — Vulkan raytracing backend
[target.'cfg(not(target_os = "macos"))'.dependencies]
ash        = "0.38"           # dynamic Vulkan loader (no "linked" feature)
ash-window = "0.13"

[build-dependencies]
